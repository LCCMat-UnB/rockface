name: petrobras
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy
  - scipy
  - pillow
  - fastapi
  - uvicorn
  - python-multipart
  - aicspylibczi
  - matplotlib
  - pytorch
  - torchvision
  - cpuonly # Use 'pytorch-cuda' se tiver GPU configurada no WSL
  - pip:
    - pylibczirw
    - weasyprint
    - lucide-react # Apenas se usar scripts de geração de ícones
